services:
  chroma:
    image: chromadb/chroma:latest
    container_name: pusdikzi-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "grep -q '1F40' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M

  ollama:
    image: chromadb/chroma:latest
    container_name: pusdikzi-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    devices:
      - /dev/dri:/dev/dri
      - /dev/dxg:/dev/dxg
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_NUM_GPU=999
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
      - ZES_ENABLE_SYSMAN=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZE_ENABLE_PCI_ID_DEVICE_ORDER=1
      - OverrideDefaultFP64Settings=1
      - IGC_EnableDPEmulation=1
      - LD_LIBRARY_PATH=/opt/ollama-ipex-llm:/usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu/intel-opencl:/usr/lib/wsl/lib
    volumes:
      - /home/doni/project/ollama-ipex-llm-2.3.0b20250725-ubuntu:/opt/ollama-ipex-llm:ro
      - /home/doni/.ollama:/root/.ollama
      - ./models:/models
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /etc/OpenCL/vendors:/etc/OpenCL/vendors:ro
      - /usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:ro
    entrypoint: ["/opt/ollama-ipex-llm/ollama", "serve"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/ollama-ipex-llm/ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chroma_data:
    driver: local
